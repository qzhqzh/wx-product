services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wx_pipeline
      POSTGRES_USER: wx_pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.sh first}
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wx_pipeline -d wx_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-wx-pipeline}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Run scripts/init-env.sh first}
    volumes:
      - ./data/minio:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        ${AWS_ACCESS_KEY_ID:-wx-pipeline}
        ${AWS_SECRET_ACCESS_KEY:?Run scripts/init-env.sh first}
        && mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-wx-pipeline}

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment: &app-environment
      DATABASE_URL: postgresql://wx_pipeline:${POSTGRES_PASSWORD:?Run scripts/init-env.sh first}@postgres:5432/wx_pipeline
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/init-env.sh first}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      USE_S3_STORAGE: "1"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-wx-pipeline}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Run scripts/init-env.sh first}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-wx-pipeline}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5.6-terra}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen3.7-plus}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?Run scripts/init-env.sh first}
    volumes:
      - ./staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=2"]
    user: "10001:10001"
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      web:
        condition: service_healthy

  beat:
    build: .
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    user: "10001:10001"
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy

volumes: {}
