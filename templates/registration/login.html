{% load static vite %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 微信造物台</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  {% static_versioned "css/app.css" as app_css %}
  <link rel="stylesheet" href="{{ app_css }}">
</head>
<body>
  <main class="login-page">
    <section class="login-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-4l-4 3v-3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/></svg>
      </div>
      <div>
        <h1>让创意进入稳定产线。</h1>
        <p>从原创 IP 和热点选题，到表情生成、逐项编审、平台质检和投稿复盘。</p>
      </div>
    </section>
    <section class="login-form-shell">
      <form class="login-form" method="post">
        {% csrf_token %}
        <h2>登录工作台</h2>
        <p>使用内部账号继续今天的制作任务。</p>
        {% if form.non_field_errors %}
          <div class="message error">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="form-field">
          <label for="{{ form.username.id_for_label }}">用户名</label>
          <input class="form-control" type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" required autofocus>
        </div>
        <div class="form-field">
          <label for="{{ form.password.id_for_label }}">密码</label>
          <input class="form-control" type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">进入造物台</button>
      </form>
    </section>
  </main>
</body>
</html>
